name: Export SigLIP 2 (v2)

# 手动触发：把 SigLIP 2 三档导出成 App 用的 int8 ONNX，结果作为 artifact 上传（不发布 Release）。
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        model: [base, large, so400m]
    steps:
      - name: 加 16 GB swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          free -h
      - name: 腾磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/ai-models/requirements.txt
      - name: 中文字体（OCR 自检要用）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 安装依赖
        run: pip install -r tools/ai-models/requirements.txt
      - name: 准备 PP-OCRv5
        run: python tools/ai-models/prepare_ppocr.py --out dist/ocr
      - name: 导出并校验
        run: python tools/ai-models/export_siglip2.py --model "${{ matrix.model }}" --ocr dist/ocr --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: siglip2-${{ matrix.model }}
          path: dist/
          retention-days: 7
